/* --- CSS STYLES --- */

<style>
.picker-svg {
width: 100%;
height: auto;
border-radius: 12px;
background: var(--bg);
border: 1px solid var(--border);
}
.picker-wall {
stroke: var(--accent);
stroke-width: 5;
stroke-linecap: round;
}
.picker-divider {
stroke: var(--border);
stroke-width: 1;
stroke-dasharray: 2 2;
}
.picker-bay-box {
fill: var(--surface2);
stroke: var(--border);
stroke-width: 1.5;
cursor: pointer;
transition: all 0.2s;
}
.picker-bay-number {
font-size: 12px;
font-weight: 700;
fill: var(--text);
text-anchor: middle;
dominant-baseline: middle;
pointer-events: none;
font-family: var(--mono);
}
.picker-zone-clickable { cursor: pointer; }
.picker-zone-clickable:active .picker-bay-box {
fill: var(--accent);
stroke: var(--accent);
}
.picker-zone-clickable:active text { fill: #fff; }
</style>

/* --- JAVASCRIPT FUNCTION --- */

<script>
